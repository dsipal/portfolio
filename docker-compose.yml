name: portfolio

# Production stack. The web image is built and pushed to GHCR by
# .github/workflows/build.yml; the host's Watchtower pulls new :latest images
# and recreates the labelled containers. Nothing is built on the server.

networks:
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
  internal:
    driver: bridge

volumes:
  mysql_data:
  ghost_content:

x-mysql-env: &mysql-env
  MYSQL_DATABASE: ${MYSQL_DATABASE:-ghost}
  MYSQL_USER: ${MYSQL_USER:-ghost}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      <<: *mysql-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    labels:
      # Never auto-restart the database
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ghost:
    # Pinned to the major version: Watchtower applies minor/patch updates only
    image: ghost:6-alpine
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Ghost redirects plain http to its https url unless the proxy says the request was secure
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "X-Forwarded-Proto: https", "http://127.0.0.1:2368/ghost/api/admin/site/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    environment:
      NODE_ENV: production
      url: https://${GHOST_DOMAIN:?GHOST_DOMAIN is required}
      database__client: mysql
      database__connection__host: mysql
      database__connection__port: 3306
      database__connection__user: ${MYSQL_USER:-ghost}
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ${MYSQL_DATABASE:-ghost}
      # Ghost emails staff sign-in codes and invites; without SMTP set, turn off
      # new-device verification (GHOST_STAFF_DEVICE_VERIFICATION=false)
      security__staffDeviceVerification: ${GHOST_STAFF_DEVICE_VERIFICATION:-true}
      mail__transport: SMTP
      mail__from: ${GHOST_MAIL_FROM:-}
      mail__options__host: ${GHOST_SMTP_HOST:-}
      mail__options__port: ${GHOST_SMTP_PORT:-587}
      mail__options__auth__user: ${GHOST_SMTP_USER:-}
      mail__options__auth__pass: ${GHOST_SMTP_PASSWORD:-}
    volumes:
      # Uploaded images and files, themes and logs; back this up with the database
      - ghost_content:/var/lib/ghost/content
    networks:
      - traefik_network
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.services.${TRAEFIK_PREFIX:-portfolio}-ghost.loadbalancer.server.port=2368"
      # HTTPS router
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-ghost.rule=Host(`${GHOST_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-ghost.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-ghost.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-ghost.service=${TRAEFIK_PREFIX:-portfolio}-ghost"
      # HTTP router (no redirect — Cloudflare tunnel connects on HTTP)
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-ghost-http.rule=Host(`${GHOST_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-ghost-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-ghost-http.service=${TRAEFIK_PREFIX:-portfolio}-ghost"

  portfolio:
    # NEXT_PUBLIC_* values are baked into this image at build time in CI
    image: ${IMAGE_REGISTRY:-ghcr.io/dsipal}/portfolio-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      ghost:
        condition: service_healthy
    environment:
      GHOST_URL: https://${GHOST_DOMAIN}
      GHOST_INTERNAL_URL: http://ghost:2368
      GHOST_CONTENT_API_KEY: ${GHOST_CONTENT_API_KEY:?GHOST_CONTENT_API_KEY is required}
      SITE_URL: https://${PORTFOLIO_DOMAIN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    networks:
      - traefik_network
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.services.${TRAEFIK_PREFIX:-portfolio}-web.loadbalancer.server.port=3000"
      # HTTPS router
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-web.rule=Host(`${PORTFOLIO_DOMAIN:?PORTFOLIO_DOMAIN is required}`)"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-web.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-web.service=${TRAEFIK_PREFIX:-portfolio}-web"
      # HTTP router (no redirect — Cloudflare tunnel connects on HTTP)
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-web-http.rule=Host(`${PORTFOLIO_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-web-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.${TRAEFIK_PREFIX:-portfolio}-web-http.service=${TRAEFIK_PREFIX:-portfolio}-web"
