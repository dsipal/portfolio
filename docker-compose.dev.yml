name: portfolio-dev

networks:
  internal:
    driver: bridge

volumes:
  ghost_content_dev:

services:
  # Ghost in development mode keeps its data in SQLite inside the content
  # volume, so the dev stack needs no database container
  ghost:
    image: ghost:6-alpine
    environment:
      NODE_ENV: development
      url: http://localhost:2368
      # No mail in dev: skip the emailed sign-in codes for new devices
      security__staffDeviceVerification: "false"
    volumes:
      - ghost_content_dev:/var/lib/ghost/content
    ports:
      - "2368:2368"
    networks:
      - internal

  portfolio:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    depends_on:
      - ghost
    environment:
      GHOST_URL: http://localhost:2368
      GHOST_INTERNAL_URL: http://ghost:2368
      GHOST_CONTENT_API_KEY: ${GHOST_CONTENT_API_KEY}
      SITE_URL: http://localhost:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev}
      # File events don't propagate through Windows/macOS bind mounts
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/repo/apps/web
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
    ports:
      - "3000:3000"
    networks:
      - internal
