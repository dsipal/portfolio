name: Build images

# Verifies every push and PR (lint, types, unit tests, e2e against mock
# Ghost content), then builds the web image. Only pushes to main publish it to
# GHCR; Watchtower on the host then picks up the new :latest tag and redeploys
# the container. Elsewhere the image build just has to succeed. Ghost itself
# runs from the official image (docker-compose.yml).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      GHOST_INTERNAL_URL: http://localhost:1338
      GHOST_CONTENT_API_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter web...

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build against mock Ghost
        working-directory: apps/web
        run: |
          node test/mock-ghost.mjs 1338 &
          pnpm exec next build

      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: portfolio-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Builds from the workspace root (one pnpm lockfile)
          context: .
          file: apps/web/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GHOST_URL=${{ vars.GHOST_URL }}
            NEXT_PUBLIC_GA_TRACKING_ID=${{ vars.NEXT_PUBLIC_GA_TRACKING_ID }}
          secrets: |
            ghost_content_api_key=${{ secrets.GHOST_CONTENT_API_KEY }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE) || '' }}
